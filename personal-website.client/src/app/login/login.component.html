<form class="login" [formGroup]="formLogin" (ngSubmit)="OnSubmitButton()">
  <div>
    <label for="email">Email Address</label>
    <input id="email" type="email" class="form-control" [ngClass]="{'is-invalid': Error('email')}" formControlName="email" placeholder="meow@example.com" autocomplete="email">
    <div class="invalid-feedback" *ngIf="Error('email')">
      <span *ngIf="formLogin.get('email')?.errors?.['required']">Email is required</span>
      <span *ngIf="formLogin.get('email')?.errors?.['email']">Enter a valid email please</span>
    </div>
  </div>
  <div>
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" class="form-control" [ngClass]="{'is-invalid': Error('password')}" placeholder="Password" autocomplete="current-password">
    <div class="invalid-feedback" *ngIf="Error('password')">
      Password is required
    </div>
  </div>
  <div>
    <label>Stay Signed In?</label>
    <input type="checkbox">
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <button type="submit">Submit</button>
</form>
