<div class="portfolio container-fluid row">
  <div class="bg-info card col-xl-4 col-md-6 col-sm-12 text-center border-4 border-primary" *ngFor="let Items of (portfolioItems$ | async)">
    <div class="card-body" routerLink="{{ Items.id }}" id="portfolio-card-body">
      <!-- <img [src]="getServerPath(Items.image.path)" height="300" width="300"> -->
       <img src="images/PlaceholderImage.png" height="300" width="300">
      <h4 class="card-text">{{ Items.title }}</h4>
      <p class="card-text">{{ Items.updatedDate | date:'mediumDate' }}</p>
      <p class="card-text">{{ Items.version }}</p>
      <p class="card-text">{{ Items.category.categoryName }}</p>
    </div>
  </div>
</div>
<div class="text-center mt-4 spacer">
  <button class="btn btn-success col-2" (click)="CreateItem()" *ngIf="isAuthenticated()">Create Item</button>
</div>
