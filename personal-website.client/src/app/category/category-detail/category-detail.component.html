<div class="container mt-5 p-2 mb-3">
  <div class="row row-cols-md-2 row-cols-1">
    <div class="col col-xl-10 col-md-10 col-sm-10">
      <div class="card text-center p-4 border-4 border-primary" id="category-card-body">
        <h1 id="card-text">{{ (category | async)!.categoryName }}</h1>
        <div>
          <button class="btn btn-primary" routerLink="../">Back to category list</button>
          <button class="btn btn-success" routerLink="/portfolio/edit/{{ (category | async)!.id }}">Edit</button>
          <button class="btn btn-danger" (click)="DeleteCategory()">Delete</button>
        </div>
      </div>
    </div>
    <div class="col col-lg-2">
      <div class="card text-center border-4 border-primary" id="category-card-body" *ngFor="let categoryItem of ( categories | async)">
        <div class="card-body" id="category-card" routerLink="../{{ categoryItem.id }}">
          <h4 id="card-text">{{ categoryItem.categoryName }}</h4>
        </div>
      </div>
    </div>
  </div>
</div>
